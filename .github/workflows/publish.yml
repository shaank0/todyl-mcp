name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Build exactly once, with the FINAL GHCR tags, load it locally (no
      # push yet), and smoke-test that artifact. We then push these same
      # tags explicitly below — never a second, separate build — so the
      # digest we publish is provably the digest we just ran. Building
      # twice (test one image, push a freshly-rebuilt other) would publish
      # an image that had never run, defeating the point of the smoke test.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # provenance/sbom default to true, which makes buildx emit an image
          # index carrying an attestation manifest. `load: true` hands that to
          # the daemon, but the attestation blob is not a layer the daemon can
          # upload — the later `docker push` then fails with "unknown blob".
          # Turning both off keeps the loaded image a plain single-platform
          # image, so the artifact we smoke-test is the artifact we can push.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/shaank0/todyl-mcp:latest
            ghcr.io/shaank0/todyl-mcp:sha-${{ steps.vars.outputs.sha_short }}

      - name: Smoke test the built image
        run: |
          set -e
          docker run -d --name smoke -p 8080:8080 \
            -e TODYL_CLIENT_ID=dummy -e TODYL_ACCESS_TOKEN=dummy \
            ghcr.io/shaank0/todyl-mcp:latest

          ready=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::container never became healthy"; docker logs smoke; docker rm -f smoke; exit 1
          fi

          # /healthz only proves Express started. Prove the MCP wiring itself
          # survived the build by driving the real Streamable HTTP endpoint:
          # an initialize handshake, then tools/list, and assert the six
          # tool names come back.
          init=$(curl -s -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}')
          echo "initialize response: $init"

          list=$(curl -s -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "tools/list response: $list"

          names=$(echo "$list" | sed -n 's/^data: //p' | jq -r '.result.tools[].name' | sort | tr '\n' ',')
          expected="device-posture-summary,get-device,list-deployment-groups,list-devices,list-invoices,tenant-report,"
          if [ "$names" != "$expected" ]; then
            echo "::error::tools/list mismatch. got=[$names] want=[$expected]"
            docker logs smoke; docker rm -f smoke; exit 1
          fi

          echo "Smoke test passed: healthz 200, six tools registered on /mcp"
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image loaded and smoke-tested above — no rebuild.
      - name: Push the smoke-tested image
        run: |
          set -e
          docker push ghcr.io/shaank0/todyl-mcp:latest
          docker push ghcr.io/shaank0/todyl-mcp:sha-${{ steps.vars.outputs.sha_short }}
